name: Build CV

on:
  push:
    branches: [main]
    paths:
      - 'assets/cv-source/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: assets/cv-source
          latexmk_shell_escape: true

      - name: Move PDF to assets/cv/
        run: |
          mkdir -p assets/cv
          mv "assets/cv-source/main.pdf" "assets/cv/[CV]Seongyu.pdf"

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/cv/[CV]Seongyu.pdf"
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "chore(cv): rebuild PDF from main.tex [skip ci]"
            git push
          fi
